[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whareformer-shape-tools"
version = "0.1.0"
description = "Point-cloud preparation and paired shape comparison."
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4", "scipy==1.15.3", "trimesh==4.6.8"]

[project.optional-dependencies]
images = ["Pillow>=10"]
reports = ["matplotlib>=3.8", "Pillow>=10"]

[project.scripts]
shape-tools = "shape_tools.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
