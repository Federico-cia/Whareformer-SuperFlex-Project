<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Il ciclo Whareformer–SuperFlex</title><link rel="stylesheet" href="stile.css"></head><body>
<header><h1>Il ciclo Whareformer–SuperFlex</h1><p>Rami paralleli · Seleziona un riquadro o un collegamento per leggere la spiegazione</p>
<nav aria-label="Comandi della mappa"><button id="toggle-panel" aria-expanded="false" aria-controls="inspector">Scheda</button><select id="node-select" aria-label="Seleziona un riquadro"><option value="">Riquadri…</option></select><select id="edge-select" aria-label="Seleziona un collegamento"><option value="">Collegamenti…</option></select><button id="width">Inizio e larghezza</button><button id="fit">Mostra tutta</button><button id="actual">100%</button><button id="zoomout" aria-label="Riduci mappa">−</button><output id="zoom-label">100%</output><button id="zoomin" aria-label="Ingrandisci mappa">+</button><button id="reset">Ripristina disposizione</button><button id="export">Esporta</button><label class="file">Importa disposizione<input id="import" type="file" accept="application/json" hidden></label><span id="notice" role="status"></span></nav></header>
<main class="workspace"><section class="viewport" aria-label="Mappa del processo"><div class="board"></div></section><aside id="inspector" hidden><div class="inspector-head"><span>SCHEDA DEL PROCESSO</span><button id="close-panel" aria-label="Chiudi scheda">×</button></div><div id="detail" aria-live="polite"></div></aside></main>
<footer class="help">Trascina lo sfondo per esplorare · Rotella per lo zoom · Clicca un elemento per la scheda · Trascina un riquadro per spostarlo</footer><script src="fonti.js"></script><script src="contenuti.js"></script><script src="app.js"></script></body></html>
